<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TanyaJer – Soal Jawab Tutorial</title>
<meta name="description" content="Tanya soalan tentang aplikasi dalam video tutorial. Jawapan ringkas terus dari FAQ.">
<meta property="og:title" content="TanyaJer – Soal Jawab Tutorial">
<meta property="og:description" content="Tanya soalan tentang aplikasi dalam video tutorial. Jawapan ringkas terus dari FAQ.">
<meta property="og:image" content="icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" type="button"><img class="logo-img" src="icon.svg" alt="" width="30" height="30"><span id="site-title">TanyaJer</span></button>
  </div>
</header>

<main>
  <!-- HALAMAN UTAMA: senarai aplikasi -->
  <section id="view-home" class="wrap">
    <div class="hero">
      <h1 id="site-heading">Ada soalan tentang app dalam tutorial?</h1>
      <p id="site-tagline">Pilih aplikasi, kemudian taip soalan anda. Jawapan diambil terus dari FAQ.</p>
    </div>
    <div id="home-notice"></div>
    <div class="search"><span class="ic">🔎</span><input id="home-search" type="search" placeholder="Cari app atau taip soalan…" autocomplete="off" aria-label="Cari app atau taip soalan" enterkeyhint="search"></div>
    <div id="home-results"></div>
    <div id="cat-tabs" class="cats" role="tablist" aria-label="Kategori"></div>
    <div id="app-grid" class="grid"></div>
    <!--SEO_LINKS-->
    <footer class="foot"><a href="admin.html">⚙️ Urus FAQ</a></footer>
  </section>

  <!-- HALAMAN SOAL JAWAB -->
  <section id="view-chat" class="wrap" hidden>
    <div id="chat-missing" hidden></div>
    <div id="chat-main">
      <div class="chat-head">
        <button class="back" id="chat-back" type="button" aria-label="Kembali">←</button>
        <div class="emo" id="chat-emo">📱</div>
        <div class="ttl"><b id="chat-name"></b><div class="sub" id="chat-sub"></div></div>
        <a class="btn sm" id="btn-video" href="#" target="_blank" rel="noopener noreferrer" hidden style="text-decoration:none">▶️<span class="t"> Tonton</span></a>
        <button class="btn sm" id="btn-allfaq" type="button">📋<span class="t"> Semua FAQ</span></button>
      </div>
      <div id="msgs" class="msgs" aria-live="polite"></div>
      <div class="composer">
        <div id="chips" class="chips"></div>
        <form id="ask-form" autocomplete="off">
          <input id="ask-input" placeholder="Taip soalan anda…" maxlength="300" aria-label="Soalan anda">
          <button class="send" id="ask-btn" type="submit" aria-label="Hantar">➤</button>
        </form>
        <div class="foot-note">📄 Jawapan diringkaskan dari FAQ · tekan “Baca jawapan penuh” untuk butiran</div>
      </div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="Semua FAQ">
    <div class="sheet-head"><b id="sheet-title">Semua FAQ</b><button class="btn sm" id="sheet-close" type="button">✕ Tutup</button></div>
    <div class="sheet-body">
      <input id="sheet-search" type="search" placeholder="Cari dalam FAQ…" autocomplete="off" aria-label="Cari dalam FAQ">
      <div id="sheet-list"></div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
